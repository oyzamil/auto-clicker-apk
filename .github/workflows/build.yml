name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk OpenClicker-debug-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenClicker-debug-apk
          path: OpenClicker-debug-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="build-${{ github.run_number }}"
          fi
          gh release create "$TAG" \
            "OpenClicker-debug-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Open Clicker debug #${{ github.run_number }}" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --prerelease